name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression suite
        working-directory: tests
        run: python test_agent_pipeline.py && python test_improvement_loop.py && python test_preferences.py
